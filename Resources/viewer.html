<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Reader</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0;
    --link:#0969da; --code-bg:#f6f8fa; --code-fg:#1f2328; --quote:#59636e;
    --table-alt:#f6f8fa; --hr:#d1d9e0; --sel:#b6d6ff;
    --tk-comment:#6e7781; --tk-string:#0a3069; --tk-keyword:#cf222e;
    --tk-number:#0550ae; --tk-func:#8250df; --tk-attr:#116329;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#3d444d;
      --link:#4493f8; --code-bg:#161b22; --code-fg:#e6edf3; --quote:#9198a1;
      --table-alt:#161b22; --hr:#3d444d; --sel:#264f78;
      --tk-comment:#8b949e; --tk-string:#a5d6ff; --tk-keyword:#ff7b72;
      --tk-number:#79c0ff; --tk-func:#d2a8ff; --tk-attr:#7ee787;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  body{
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--sel);}
  #wrap{max-width:880px;margin:0 auto;padding:46px 56px 120px;}
  #content{word-wrap:break-word;outline:none;caret-color:var(--fg);}
  #content > *:first-child{margin-top:0;}
  h1,h2,h3,h4,h5,h6{margin:1.5em 0 .6em;font-weight:600;line-height:1.25;}
  h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border);}
  h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border);}
  h3{font-size:1.25em;} h4{font-size:1em;} h5{font-size:.9em;} h6{font-size:.85em;color:var(--muted);}
  p{margin:0 0 1em;}
  a{color:var(--link);text-decoration:none;} a:hover{text-decoration:underline;}
  ul,ol{margin:0 0 1em;padding-left:2em;} li{margin:.25em 0;}
  li > ul, li > ol{margin:.25em 0;}
  blockquote{margin:0 0 1em;padding:0 1em;color:var(--quote);border-left:.25em solid var(--border);}
  blockquote > :last-child{margin-bottom:0;}
  hr{height:1px;border:0;background:var(--hr);margin:1.6em 0;}
  img{max-width:100%;}
  code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;}
  p code,li code,td code{background:var(--code-bg);padding:.2em .4em;border-radius:6px;}
  pre{background:var(--code-bg);color:var(--code-fg);padding:14px 16px;border-radius:8px;overflow:auto;margin:0 0 1em;line-height:1.45;}
  pre code{background:none;padding:0;font-size:.85em;display:block;}
  table{border-collapse:collapse;margin:0 0 1em;display:block;overflow:auto;width:max-content;max-width:100%;}
  th,td{border:1px solid var(--border);padding:6px 13px;}
  tr:nth-child(2n){background:var(--table-alt);}
  th{font-weight:600;}
  del{opacity:.7;}
  .task-list-item{list-style:none;}
  .task-list-item input{margin-right:.5em;}
  #editwrap{display:none;align-items:stretch;background:var(--code-bg);border-radius:8px;overflow:hidden;}
  #gutter{flex:0 0 auto;text-align:right;color:var(--muted);
    -webkit-user-select:none;user-select:none;
    padding:14px 10px 0 14px;border-right:1px solid var(--border);
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:13.6px;line-height:1.45;white-space:pre;-webkit-font-smoothing:antialiased;}
  #editor{display:block;flex:1 1 auto;min-width:0;width:100%;border:0;outline:none;resize:none;
    overflow-x:auto;overflow-y:hidden;white-space:pre;
    background:transparent;color:var(--code-fg);border-radius:0;padding:14px 16px;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:13.6px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .tk-comment{color:var(--tk-comment);font-style:italic;}
  .tk-string{color:var(--tk-string);}
  .tk-keyword{color:var(--tk-keyword);}
  .tk-number{color:var(--tk-number);}
  .tk-func{color:var(--tk-func);}
  .tk-attr{color:var(--tk-attr);}
  #empty{color:var(--muted);text-align:center;margin-top:30vh;font-size:1.1em;}
  /* find bar */
  #findbar{position:fixed;top:12px;right:18px;display:none;align-items:center;gap:4px;
    background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 8px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:1000;font-size:13px;}
  #findbar.show{display:flex;}
  #findinput{border:1px solid var(--border);background:var(--code-bg);color:var(--fg);
    border-radius:6px;padding:5px 9px;font-size:13px;width:210px;outline:none;}
  #findinput:focus{border-color:var(--link);}
  #findcount{color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}
  .find-btn{border:0;background:transparent;color:var(--fg);cursor:pointer;font-size:14px;
    padding:3px 8px;border-radius:6px;line-height:1;}
  .find-btn:hover{background:var(--code-bg);}
  .find-btn:disabled{opacity:.35;cursor:default;background:transparent;}
  mark.find-hit{background:#ffd33d;color:#1f2328;border-radius:2px;}
  mark.find-hit.current{background:#ff8c00;color:#1f2328;}
  @media (prefers-color-scheme: dark){
    mark.find-hit{background:#9e6a03;color:#fff;}
    mark.find-hit.current{background:#e36209;color:#fff;}
  }
  /* line/word count badge */
  #stats{position:fixed;bottom:12px;right:16px;display:none;
    background:var(--code-bg);color:var(--muted);border:1px solid var(--border);
    border-radius:20px;padding:3px 11px;font-size:12px;font-variant-numeric:tabular-nums;
    opacity:.9;z-index:900;user-select:none;}
</style>
</head>
<body>
<div id="wrap">
  <article id="content" contenteditable="true" spellcheck="false"></article>
  <div id="editwrap">
    <div id="gutter" aria-hidden="true"></div>
    <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  </div>
  <div id="empty">Open a <code>.md</code> file to read it.</div>
</div>
<div id="findbar">
  <input id="findinput" type="text" placeholder="Find" autocomplete="off" spellcheck="false">
  <span id="findcount"></span>
  <button class="find-btn" id="findprev" title="Previous (&#8679;&#8629;)">&#8593;</button>
  <button class="find-btn" id="findnext" title="Next (&#8629;)">&#8595;</button>
  <button class="find-btn" id="findclose" title="Close (esc)">&#10005;</button>
</div>
<div id="stats"></div>
<script>
"use strict";
(function(){
  /* ---------- helpers ---------- */
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function escAttr(s){return esc(s).replace(/"/g,"&quot;");}

  /* ---------- lightweight generic syntax highlighter ---------- */
  var KEYWORDS = new Set(("abstract and as assert async await begin bool boolean break byte case catch char "+
    "class const continue def default del do double elif else end enum except export extends extern "+
    "false final finally float fn for from func function global go goto if impl implements import in "+
    "int interface is lambda let long match mod module mut namespace new nil none not null or package "+
    "pass private protected public raise return self short signed sizeof static struct super switch "+
    "this throw throws trait true try type typedef typeof union unsigned use using var virtual void "+
    "volatile when where while with yield").split(" "));

  // single pass: comments | strings | numbers | identifiers; everything else escaped verbatim
  var TOKEN = /(\/\*[\s\S]*?\*\/)|(\/\/[^\n]*|#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b0x[0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)/g;

  function highlight(code){
    var out = "", last = 0, m;
    TOKEN.lastIndex = 0;
    while((m = TOKEN.exec(code)) !== null){
      if(m[0] === ""){ TOKEN.lastIndex++; continue; }
      if(m.index > last) out += esc(code.slice(last, m.index));
      if(m[1] || m[2])  out += '<span class="tk-comment">'+esc(m[0])+'</span>';
      else if(m[3])     out += '<span class="tk-string">'+esc(m[0])+'</span>';
      else if(m[4])     out += '<span class="tk-number">'+esc(m[0])+'</span>';
      else if(m[5])     out += KEYWORDS.has(m[0]) ? '<span class="tk-keyword">'+esc(m[0])+'</span>' : esc(m[0]);
      last = TOKEN.lastIndex;
    }
    if(last < code.length) out += esc(code.slice(last));
    return out;
  }

  /* ---------- inline markdown ---------- */
  // placeholders use private-use sentinels so they never collide with literal digits
  var PH_OPEN = "", PH_CLOSE = "";
  var PH_RE = /(\d+)/g;

  function inline(text){
    var holders = [];
    function hold(html){ holders.push(html); return PH_OPEN + (holders.length-1) + PH_CLOSE; }

    text = text.replace(/\\([\\`*_{}\[\]()#+\-.!~>|])/g, function(m,c){ return hold(esc(c)); });
    text = text.replace(/(`+)([\s\S]*?)\1/g, function(m,t,c){ return hold("<code>"+esc(c.replace(/^ | $/g,""))+"</code>"); });
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(m,a,src,t){
      return hold('<img src="'+escAttr(src)+'" alt="'+escAttr(a)+'"'+(t?' title="'+escAttr(t)+'"':'')+'>');
    });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(m,txt,href,t){
      return hold('<a href="'+escAttr(href)+'"'+(t?' title="'+escAttr(t)+'"':'')+'>'+inline(txt)+'</a>');
    });
    text = text.replace(/<((?:https?|mailto):[^>\s]+)>/g, function(m,u){ return hold('<a href="'+escAttr(u)+'">'+esc(u)+'</a>'); });

    text = esc(text);

    text = text.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    text = text.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/__([^_]+?)__/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
    text = text.replace(/(^|[^_\w])_([^_\s][^_]*?)_(?![\w])/g, "$1<em>$2</em>");
    text = text.replace(/~~([^~]+?)~~/g, "<del>$1</del>");

    text = text.replace(PH_RE, function(m,i){ return holders[+i]; });
    return text;
  }

  /* ---------- block parsing ---------- */
  var reHeading = /^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  var reHr      = /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  var reFence   = /^(\s*)(```+|~~~+)\s*([^\s`]*)\s*$/;
  var reQuote   = /^ {0,3}>\s?(.*)$/;
  var reUl      = /^(\s*)([-*+])\s+(.*)$/;
  var reOl      = /^(\s*)(\d+)[.)]\s+(.*)$/;
  var reTableSep= /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;

  function indentOf(line){ var m=line.match(/^(\s*)/); return m[1].replace(/\t/g,"    ").length; }
  function isListItem(line){ return reUl.test(line)||reOl.test(line); }
  function isOrdered(line){ return reOl.test(line); }

  function parseBlocks(src){
    var lines = src.replace(/\r\n?/g,"\n").replace(/\t/g,"    ").split("\n");
    var out = [];
    var i = 0;
    while(i < lines.length){
      var line = lines[i];

      if(/^\s*$/.test(line)){ i++; continue; }

      var f = line.match(reFence);
      if(f){
        var fence = f[2][0], lang = f[3] || "", buf = [];
        var closeRe = new RegExp("^\\s*"+fence+"{3,}\\s*$");
        i++;
        while(i < lines.length && !closeRe.test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code'+(lang?' class="language-'+escAttr(lang)+'"':'')+'>'+highlight(buf.join("\n"))+'</code></pre>');
        continue;
      }

      var h = line.match(reHeading);
      if(h){ var lvl=h[1].length; out.push("<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"); i++; continue; }

      if(reHr.test(line)){ out.push("<hr>"); i++; continue; }

      if(reQuote.test(line)){
        var qbuf=[];
        while(i<lines.length && (reQuote.test(lines[i]) || (!/^\s*$/.test(lines[i]) && qbuf.length && !isListItem(lines[i])))){
          var qm = lines[i].match(reQuote);
          qbuf.push(qm ? qm[1] : lines[i]);
          i++;
        }
        out.push("<blockquote>"+parseBlocks(qbuf.join("\n"))+"</blockquote>");
        continue;
      }

      if(line.indexOf("|")!==-1 && i+1<lines.length && reTableSep.test(lines[i+1])){
        var headerCells = splitRow(line);
        var aligns = splitRow(lines[i+1]).map(function(c){
          var l=/^:/.test(c.trim()), r=/:$/.test(c.trim());
          return l&&r?"center":r?"right":l?"left":"";
        });
        i += 2;
        var rows = [];
        while(i<lines.length && lines[i].indexOf("|")!==-1 && !/^\s*$/.test(lines[i])){
          rows.push(splitRow(lines[i])); i++;
        }
        out.push(renderTable(headerCells, aligns, rows));
        continue;
      }

      if(isListItem(line)){
        var lr = parseList(lines, i, indentOf(line));
        out.push(lr.html); i = lr.next; continue;
      }

      var pbuf=[];
      while(i<lines.length && !/^\s*$/.test(lines[i]) &&
            !reHeading.test(lines[i]) && !reHr.test(lines[i]) && !reFence.test(lines[i]) &&
            !reQuote.test(lines[i]) && !isListItem(lines[i]) &&
            !(lines[i].indexOf("|")!==-1 && i+1<lines.length && reTableSep.test(lines[i+1]))){
        pbuf.push(lines[i]); i++;
      }
      var ptext = pbuf.join("\n").replace(/ {2,}\n/g,"<br>\n");
      out.push("<p>"+inline(ptext)+"</p>");
    }
    return out.join("\n");
  }

  function splitRow(line){
    var s = line.trim().replace(/^\|/,"").replace(/\|$/,"");
    var cells=[], cur="", esc=false;
    for(var k=0;k<s.length;k++){
      var ch=s[k];
      if(esc){ cur+=ch; esc=false; continue; }
      if(ch==="\\"){ cur+=ch; esc=true; continue; }
      if(ch==="|"){ cells.push(cur); cur=""; } else cur+=ch;
    }
    cells.push(cur);
    return cells.map(function(c){return c.trim();});
  }

  function renderTable(header, aligns, rows){
    function cell(tag, text, align){ return "<"+tag+(align?' style="text-align:'+align+'"':'')+">"+inline(text)+"</"+tag+">"; }
    var html="<table><thead><tr>";
    header.forEach(function(c,idx){ html+=cell("th",c,aligns[idx]||""); });
    html+="</tr></thead><tbody>";
    rows.forEach(function(r){
      html+="<tr>";
      for(var c=0;c<header.length;c++){ html+=cell("td", r[c]!==undefined?r[c]:"", aligns[c]||""); }
      html+="</tr>";
    });
    return html+"</tbody></table>";
  }

  function parseList(lines, start, baseIndent){
    var ordered = isOrdered(lines[start]);
    var html = ordered ? "<ol>" : "<ul>";
    var i = start;
    while(i < lines.length){
      if(/^\s*$/.test(lines[i])){
        var j=i+1;
        while(j<lines.length && /^\s*$/.test(lines[j])) j++;
        // continue same list only if next item is same type at same indent
        if(j<lines.length && isListItem(lines[j]) && indentOf(lines[j])===baseIndent && isOrdered(lines[j])===ordered){ i=j; continue; }
        break;
      }
      var ind = indentOf(lines[i]);
      if(!isListItem(lines[i]) || ind < baseIndent) break;
      if(ind > baseIndent) break;
      if(isOrdered(lines[i]) !== ordered) break; // marker type switched -> new list

      var m = lines[i].match(reUl) || lines[i].match(reOl);
      var itemLines = [ m[3] ];
      i++;
      while(i < lines.length){
        if(/^\s*$/.test(lines[i])){
          var k=i+1;
          while(k<lines.length && /^\s*$/.test(lines[k])) k++;
          if(k<lines.length && indentOf(lines[k])>baseIndent){ itemLines.push(""); i++; continue; }
          break;
        }
        var ind2 = indentOf(lines[i]);
        if(ind2 > baseIndent){ itemLines.push(lines[i].slice(baseIndent+2)); i++; continue; }
        if(!isListItem(lines[i]) && ind2 >= baseIndent && ind2 > 0){ itemLines.push(lines[i].slice(baseIndent)); i++; continue; }
        break;
      }
      html += "<li>" + renderItem(itemLines.join("\n")) + "</li>";
    }
    return { html: html + (ordered?"</ol>":"</ul>"), next: i };
  }

  function renderItem(text){
    var task = text.match(/^\[([ xX])\]\s+([\s\S]*)$/);
    var prefix="", isTask=false;
    if(task){
      isTask=true;
      prefix = '<input type="checkbox" contenteditable="false"'+(task[1].toLowerCase()==="x"?" checked":"")+'> ';
      text = task[2];
    }
    var rest = text.split("\n").slice(1).join("\n");
    var hasBlock = /\n\s*\n/.test(text) || /^\s*([-*+]|\d+[.)])\s/m.test(rest);
    var inner;
    if(/\n/.test(text) && hasBlock){
      inner = parseBlocks(text);
      inner = inner.replace(/^<p>([\s\S]*?)<\/p>\n?/, function(m,c){ return /<(ul|ol|pre|blockquote|table)/.test(m)? m : c+"\n"; });
    } else {
      inner = inline(text.trim());
    }
    if(isTask){
      // mark the <li> as a task item via a wrapping span carrying the class on the list bullet
      return '<span class="task-list-item">'+prefix+inner+'</span>';
    }
    return inner;
  }

  /* ---------- HTML -> Markdown (serializer for rendered-view editing) ---------- */
  // Covers exactly the HTML our own renderer emits, plus the noise WebKit
  // contenteditable produces (divs, styled spans, &nbsp;). Never throws:
  // domToMarkdown falls back to textContent on any error.
  var BLOCK_TAGS = {ADDRESS:1,ARTICLE:1,ASIDE:1,BLOCKQUOTE:1,DIV:1,DL:1,FIGURE:1,FOOTER:1,
    H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,HEADER:1,HR:1,MAIN:1,NAV:1,OL:1,P:1,PRE:1,SECTION:1,TABLE:1,UL:1};

  function domToMarkdown(root){
    try{
      var md = serializeBlockChildren(root);
      if(md === "") return "";
      return md.replace(/\n+$/,"") + "\n";
    }catch(e){
      return root.textContent || "";
    }
  }

  function serializeBlockChildren(el){
    var blocks = [], buf = "";
    function flush(){
      var t = buf.replace(/^\n+/,"").replace(/\n+$/,"");
      if(t.trim() !== "") blocks.push(t);
      buf = "";
    }
    var kids = el.childNodes;
    for(var i=0;i<kids.length;i++){
      var n = kids[i];
      if(n.nodeType === 3){ buf += serializeInlineNode(n, buf); continue; }
      if(n.nodeType !== 1) continue;
      if(BLOCK_TAGS[n.tagName]){
        flush();
        var b = serializeBlockElement(n);
        if(b.trim() !== "") blocks.push(b);
      } else {
        buf += serializeInlineNode(n, buf);
      }
    }
    flush();
    return blocks.join("\n\n");
  }

  function serializeBlockElement(n){
    var tag = n.tagName;
    var hm = /^H([1-6])$/.exec(tag);
    if(hm){
      var lvl = +hm[1];
      return "######".slice(0, lvl) + " " + serializeInlineChildren(n).replace(/\s*\n\s*/g," ").trim();
    }
    if(tag === "P")  return serializeInlineChildren(n).replace(/^\n+/,"").replace(/\n+$/,"");
    if(tag === "HR") return "---";
    if(tag === "PRE") return serializePre(n);
    if(tag === "BLOCKQUOTE"){
      var inner = serializeBlockChildren(n);
      return inner.split("\n").map(function(l){ return l ? "> " + l : ">"; }).join("\n");
    }
    if(tag === "UL" || tag === "OL") return serializeList(n);
    if(tag === "TABLE") return serializeTable(n);
    if(tag === "DIV"){
      if(hasBlockChild(n)) return serializeBlockChildren(n);
      return serializeInlineChildren(n).replace(/^\n+/,"").replace(/\n+$/,"");
    }
    // unknown block-ish element: serialize its children
    var fb = serializeBlockChildren(n);
    return fb !== "" ? fb : (n.textContent || "");
  }

  function hasBlockChild(el){
    for(var c = el.firstElementChild; c; c = c.nextElementSibling){
      if(BLOCK_TAGS[c.tagName]) return true;
    }
    return false;
  }

  function serializeInlineChildren(el){
    var out = "";
    var kids = el.childNodes;
    for(var i=0;i<kids.length;i++) out += serializeInlineNode(kids[i], out);
    return out;
  }

  // `out` is what has been emitted so far in the current inline run; used to
  // avoid doubling the newline after <br> (renderer emits "<br>\n").
  function serializeInlineNode(n, out){
    if(n.nodeType === 3){
      var s = n.nodeValue.replace(/\u00a0/g, " ");
      if(out.slice(-1) === "\n" && s.charAt(0) === "\n") s = s.slice(1);
      return s;
    }
    if(n.nodeType !== 1) return "";
    var tag = n.tagName;
    switch(tag){
      case "BR": return "  \n";
      case "STRONG": case "B": return wrapInline(n, "**");
      case "EM": case "I":     return wrapInline(n, "*");
      case "DEL": case "S": case "STRIKE": return wrapInline(n, "~~");
      case "CODE": return serializeInlineCode(n);
      case "A": {
        var href = n.getAttribute("href") || "";
        var at = n.getAttribute("title");
        return "[" + serializeInlineChildren(n) + "](" + href + (at ? ' "' + at + '"' : "") + ")";
      }
      case "IMG": {
        var it = n.getAttribute("title");
        return "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") +
               (it ? ' "' + it + '"' : "") + ")";
      }
      case "INPUT":
        if((n.getAttribute("type") || "").toLowerCase() === "checkbox") return n.checked ? "[x] " : "[ ] ";
        return "";
      // <mark> (find hits), <span> (tk-* highlight spans, task wrapper,
      // WebKit style spans) and anything unknown are transparent.
      case "MARK": case "SPAN": case "FONT": case "U":
        return serializeInlineChildren(n);
      default:
        if(BLOCK_TAGS[tag]) return "\n" + serializeBlockElement(n) + "\n";
        return serializeInlineChildren(n);
    }
  }

  function wrapInline(n, d){
    var inner = serializeInlineChildren(n);
    if(inner.trim() === "") return inner;
    return d + inner + d;
  }

  function serializeInlineCode(n){
    var txt = n.textContent;
    var max = 0, runs = txt.match(/`+/g) || [];
    for(var i=0;i<runs.length;i++) if(runs[i].length > max) max = runs[i].length;
    var fence = new Array(max + 2).join("`");
    var pad = (max > 0 || /^`|`$/.test(txt)) ? " " : "";
    return fence + pad + txt + pad + fence;
  }

  function serializePre(pre){
    var code = pre.querySelector("code") || pre;
    var lang = "";
    var cm = /(?:^|\s)language-(\S+)/.exec(code.className || "");
    if(cm) lang = cm[1];
    var txt = code.textContent.replace(/\n$/,"");   // tk-* spans flatten to plain text
    var fl = 3, runs = txt.match(/`{3,}/g) || [];
    for(var i=0;i<runs.length;i++) if(runs[i].length >= fl) fl = runs[i].length + 1;
    var fence = new Array(fl + 1).join("`");
    return fence + lang + "\n" + txt + "\n" + fence;
  }

  function serializeList(list){
    var ordered = list.tagName === "OL";
    var idx = parseInt(list.getAttribute("start") || "1", 10) || 1;
    var lines = [];
    for(var c = list.firstElementChild; c; c = c.nextElementSibling){
      if(c.tagName !== "LI") continue;
      lines.push(serializeListItem(c, ordered ? (idx++) + ". " : "- "));
    }
    return lines.join("\n");
  }

  function serializeListItem(li, marker){
    var head = "", subs = [], taskPrefix = "";
    function eat(nodes, skipCheckbox){
      for(var i=0;i<nodes.length;i++){
        var n = nodes[i];
        if(n.nodeType === 1){
          if(skipCheckbox && n.tagName === "INPUT") continue;
          if(n.tagName === "UL" || n.tagName === "OL"){ subs.push(serializeList(n)); continue; }
          if(n.tagName === "SPAN" && /(^|\s)task-list-item(\s|$)/.test(n.className || "")){
            var cb = n.querySelector('input[type="checkbox"]');
            if(cb) taskPrefix = cb.checked ? "[x] " : "[ ] ";
            eat(n.childNodes, true);
            continue;
          }
          if(BLOCK_TAGS[n.tagName]){ subs.push(serializeBlockElement(n)); continue; }
        }
        head += serializeInlineNode(n, head);
      }
    }
    eat(li.childNodes, false);
    var item = marker + taskPrefix + head.replace(/^\s+/,"").replace(/\s+$/,"");
    if(subs.length){
      var sub = subs.join("\n").split("\n").map(function(l){ return l ? "  " + l : l; }).join("\n");
      item += "\n" + sub;
    }
    return item;
  }

  function serializeTable(tbl){
    var trs = tbl.querySelectorAll("tr");
    if(!trs.length) return tbl.textContent || "";
    function cellText(c){
      return serializeInlineChildren(c).replace(/\n+/g," ").trim().replace(/\|/g,"\\|");
    }
    var header = [], aligns = [];
    var hc = trs[0].children;
    for(var i=0;i<hc.length;i++){
      header.push(cellText(hc[i]));
      var a = (hc[i].style && hc[i].style.textAlign) || "";
      aligns.push(a === "center" ? ":---:" : a === "right" ? "---:" : a === "left" ? ":---" : "---");
    }
    var lines = ["| " + header.join(" | ") + " |", "| " + aligns.join(" | ") + " |"];
    for(var r=1;r<trs.length;r++){
      var cells = [], tc = trs[r].children;
      for(var k=0;k<tc.length;k++) cells.push(cellText(tc[k]));
      lines.push("| " + cells.join(" | ") + " |");
    }
    return lines.join("\n");
  }

  /* ---------- editing ---------- */
  var rawMD = "", dirty = false;
  var renderedFor = "";   // the markdown string the current #content DOM was rendered from / serialized to
  var editor = document.getElementById("editor");
  var content = document.getElementById("content");
  var editwrap = document.getElementById("editwrap");
  var gutter = document.getElementById("gutter");

  function editVisible(){ return editwrap.style.display === "flex"; }

  function notifyDirty(){
    try{ window.webkit.messageHandlers.dirty.postMessage(dirty); }catch(e){}
  }
  function setDirty(d){ if(dirty !== d){ dirty = d; notifyDirty(); } }
  function autosize(){
    editor.style.height = "auto";
    editor.style.height = Math.max(editor.scrollHeight + 2, window.innerHeight * 0.7) + "px";
  }

  var gutterLines = -1;
  function updateGutter(){
    var n = editor.value.split("\n").length;
    if(n === gutterLines) return;
    gutterLines = n;
    var buf = new Array(n);
    for(var i=0;i<n;i++) buf[i] = i + 1;
    gutter.textContent = buf.join("\n");
  }

  var statsEl = document.getElementById("stats");
  function updateStats(text){
    var norm = text.replace(/\r\n?/g, "\n");
    var arr = norm.split("\n");
    if(arr.length && arr[arr.length-1] === "") arr.pop(); // ignore trailing newline
    var lineCount = arr.length;
    var words = (norm.match(/\S+/g) || []).length;
    statsEl.textContent = lineCount.toLocaleString() + (lineCount === 1 ? " line" : " lines") +
                          " · " + words.toLocaleString() + (words === 1 ? " word" : " words");
    statsEl.style.display = "block";
  }

  editor.addEventListener("input", function(){
    setDirty(editor.value !== rawMD); autosize(); updateGutter(); updateStats(editor.value);
  });
  editor.addEventListener("keydown", function(e){
    if(e.key === "Tab"){
      e.preventDefault();
      editor.setRangeText("  ", editor.selectionStart, editor.selectionEnd, "end");
      setDirty(editor.value !== rawMD); autosize(); updateGutter(); updateStats(editor.value);
    }
  });
  window.addEventListener("resize", function(){ if(editVisible()) autosize(); });

  // Rendered-view editing: on every actual edit, reverse-convert the DOM to
  // markdown and mirror it into the (hidden) textarea, which remains the
  // source of truth for MDGetContent()/saving. The rendered DOM itself is
  // never re-rendered here, so the caret and native undo stay intact.
  function syncFromRendered(){
    var md = domToMarkdown(content);
    editor.value = md;
    renderedFor = md;
    setDirty(editor.value !== rawMD);
    updateGutter();
    updateStats(md);
  }
  content.addEventListener("input", syncFromRendered);

  // Task-list checkboxes: WebKit's activation behavior inside contenteditable
  // is unreliable (and a canceled click reverts .checked after dispatch), so
  // we own the toggle: the "checked" attribute tracks the authoritative state,
  // and we apply the flip after the click dispatch has fully completed.
  function isCheckbox(t){
    return t && t.nodeType === 1 && t.tagName === "INPUT" && t.type === "checkbox";
  }
  content.addEventListener("mousedown", function(e){
    if(isCheckbox(e.target)) e.preventDefault();   // no caret placement on the widget
  });
  content.addEventListener("click", function(e){
    var t = e.target;
    var link = t && t.closest ? t.closest("a") : null;
    if(link && e.metaKey){
      e.preventDefault();
      e.stopPropagation();
      try{ window.webkit.messageHandlers.openLink.postMessage(link.getAttribute("href") || ""); }catch(err){}
      return;
    }
    if(!isCheckbox(t)) return;
    e.preventDefault();
    var newVal = !t.hasAttribute("checked");
    setTimeout(function(){                          // run after any activation revert
      t.checked = newVal;
      if(newVal) t.setAttribute("checked",""); else t.removeAttribute("checked");
      syncFromRendered();
    }, 0);
  });

  window.MDGetContent = function(){ return btoa(unescape(encodeURIComponent(editor.value))); };
  window.MDIsDirty = function(){ return dirty; };
  window.MDMarkSaved = function(){ rawMD = editor.value; setDirty(false); };

  /* ---------- find in page ---------- */
  var findQuery = "", findHits = [], findIndex = -1, findOpen = false;

  function clearMarks(){
    var marks = document.querySelectorAll("mark.find-hit");
    for(var i=0;i<marks.length;i++){
      var m = marks[i];
      m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
    }
    document.getElementById("content").normalize();
    findHits = []; findIndex = -1;
  }
  function setCurrent(i){
    if(!findHits.length) return;
    if(!editVisible() && findIndex>=0 && findHits[findIndex]) findHits[findIndex].classList.remove("current");
    findIndex = ((i % findHits.length) + findHits.length) % findHits.length;
    if(editVisible()){
      var hit = findHits[findIndex];
      editor.setSelectionRange(hit.start, hit.end);

      // The textarea grows with its contents, so reveal the selected source
      // line by scrolling the document rather than the textarea itself.
      var before = editor.value.slice(0, hit.start);
      var line = (before.match(/\n/g) || []).length;
      var style = window.getComputedStyle(editor);
      var lineHeight = parseFloat(style.lineHeight) || 19.72;
      var paddingTop = parseFloat(style.paddingTop) || 0;
      var editorTop = editor.getBoundingClientRect().top + window.scrollY;
      var targetY = editorTop + paddingTop + line * lineHeight - window.innerHeight / 2;
      window.scrollTo(0, Math.max(0, targetY));
    } else {
      var el = findHits[findIndex];
      el.classList.add("current");
      el.scrollIntoView({block:"center", inline:"nearest"});
    }
    document.getElementById("findcount").textContent = (findIndex+1)+"/"+findHits.length;
  }
  function doSearch(q){
    clearMarks();
    findQuery = q;
    var countEl = document.getElementById("findcount");
    if(!q){ countEl.textContent = ""; return; }
    var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    if(editVisible()){
      var text = editor.value, match;
      while((match = re.exec(text)) !== null){
        findHits.push({start:match.index, end:match.index + match[0].length});
        if(match[0] === "") re.lastIndex++;
      }
      if(findHits.length){ findIndex = -1; setCurrent(0); }
      else { countEl.textContent = "0/0"; }
      return;
    }
    var container = content;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){ return (n.nodeValue && n.nodeValue.length) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
    });
    var nodes = [], n;
    while((n = walker.nextNode())) nodes.push(n);
    for(var k=0;k<nodes.length;k++){
      var node = nodes[k], text = node.nodeValue;
      re.lastIndex = 0;
      if(!re.test(text)) continue;
      re.lastIndex = 0;
      var frag = document.createDocumentFragment(), last = 0, m;
      while((m = re.exec(text)) !== null){
        if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var mk = document.createElement("mark");
        mk.className = "find-hit";
        mk.textContent = m[0];
        frag.appendChild(mk);
        last = m.index + m[0].length;
        if(m[0] === "") re.lastIndex++;
      }
      if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
    findHits = Array.prototype.slice.call(container.querySelectorAll("mark.find-hit"));
    if(findHits.length){ findIndex = -1; setCurrent(0); }
    else { countEl.textContent = "0/0"; }
  }

  window.MDFind = function(){
    document.getElementById("findbar").classList.add("show");
    findOpen = true;
    var inp = document.getElementById("findinput");
    inp.focus(); inp.select();
    if(inp.value) doSearch(inp.value);
  };
  window.MDFindNext = function(){ if(findHits.length) setCurrent(findIndex+1); };
  window.MDFindPrev = function(){ if(findHits.length) setCurrent(findIndex-1); };
  window.MDFindClose = function(){
    document.getElementById("findbar").classList.remove("show");
    findOpen = false;
    clearMarks();
    document.getElementById("findcount").textContent = "";
    if(editVisible()) editor.focus({preventScroll:true});
  };

  (function wireFind(){
    var inp = document.getElementById("findinput");
    inp.addEventListener("input", function(){ doSearch(this.value); });
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); if(e.shiftKey) window.MDFindPrev(); else window.MDFindNext(); }
      else if(e.key === "Escape"){ e.preventDefault(); window.MDFindClose(); }
    });
    document.getElementById("findnext").addEventListener("click", window.MDFindNext);
    document.getElementById("findprev").addEventListener("click", window.MDFindPrev);
    document.getElementById("findclose").addEventListener("click", window.MDFindClose);
  })();

  /* ---------- public API used by Swift ---------- */
  window.MDRender = function(b64){
    var md = decodeURIComponent(escape(atob(b64)));
    rawMD = md;
    document.getElementById("empty").style.display = "none";
    // if the file caught up with our unsaved edits (e.g. edited externally to
    // the same text), we are clean again
    if(dirty && editor.value === md) setDirty(false);
    if(!dirty){
      // keep the caret stable when the incoming content matches the editor
      // (e.g. right after save)
      if(editor.value !== md) editor.value = md;
      content.innerHTML = parseBlocks(md);
      renderedFor = md;
      if(editVisible()) autosize();
    }
    // when dirty: keep the current DOM and editor content — unsaved edits
    // (rendered-view or edit-view) must not be clobbered by a live reload
    updateGutter();
    updateStats(editor.value);
    if(findOpen && findQuery) doSearch(findQuery); // keep highlights after live reload
  };
  window.MDSetMode = function(mode){
    if(mode === "edit"){
      document.getElementById("empty").style.display = "none";
      content.style.display = "none";
      var wasHidden = !editVisible();
      editwrap.style.display = "flex";
      autosize();
      updateGutter();
      if(wasHidden) editor.focus();
    } else {
      if(editor.value !== renderedFor){
        // editor holds newer markdown than what the rendered DOM shows
        // (unsaved edit-view changes) — re-render so both views agree
        content.innerHTML = parseBlocks(editor.value);
        renderedFor = editor.value;
      }
      editwrap.style.display = "none";
      content.style.display = "block";
    }
    if(findOpen && findQuery) doSearch(findQuery); // re-search the now-visible view
    else clearMarks();
  };
  window.MDScrollFraction = function(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    return h>0 ? (window.scrollY / h) : 0;
  };
  window.MDScrollTo = function(frac){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, h*frac);
  };
})();
</script>
</body>
</html>
